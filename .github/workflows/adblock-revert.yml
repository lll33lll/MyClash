name: adblock-revert

on:
  push:
    paths:
      - '.github/workflows/adblock-revert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 还原去广告默认值
        run: |
          python3 - <<'PYEOF'
          def patch(path, pairs, n=1):
              s = open(path, encoding='utf-8', newline='').read()
              for old, new in pairs:
                  if s.count(old) == n:
                      open(path, 'w', encoding='utf-8', newline='').write(s.replace(old, new))
                      print('reverted', path)
                      return
              for _, new in pairs:
                  if s.count(new) == n:
                      print('已还原，跳过', path)
                      return
              raise SystemExit('no match: ' + path)

          patch('Script/mihomoScript.js', [
              ('  AdBlock: false, // 广告拦截（默认关闭）', '  AdBlock: true, // 广告拦截'),
          ])
          patch('Script/Script.js', [
              ('  AdBlock: false, // 广告拦截（默认关闭）', '  AdBlock: true, // 广告拦截'),
          ])
          patch('.github/localize.js', [
              ("'生成地区自动选择组', 'AdBlock']", "'生成地区自动选择组']"),
          ], n=2)
          patch('.github/localize.js', [
              ('已恢复「关闭自动测速 / 关闭去广告」的 fork 默认', '已恢复「关闭自动测速」的 fork 默认'),
          ])
          patch('.github/localize.js', [
              (
                  "console.log(forkPatched ? '✓ 已恢复 fork 默认（关闭自动测速 / 关闭去广告）' : 'fork 默认（关闭自动测速 / 关闭去广告）未被改动');",
                  "console.log(forkPatched ? '✓ 已恢复 fork 默认（关闭自动测速）' : 'fork 默认（关闭自动测速）未被改动');",
              ),
              (
                  "console.log(\n  forkPatched ? '✓ 已恢复 fork 默认（关闭自动测速 / 关闭去广告）' : 'fork 默认（关闭自动测速 / 关闭去广告）未被改动',\n);",
                  "console.log(forkPatched ? '✓ 已恢复 fork 默认（关闭自动测速）' : 'fork 默认（关闭自动测速）未被改动');",
              ),
          ])
          PYEOF

      - name: 自检
        run: |
          grep -c 'AdBlock: true' Script/mihomoScript.js Script/Script.js
          node Test/run-tests.js --node
          GITHUB_REPOSITORY="${{ github.repository }}" node .github/localize.js

      - name: 提交
        run: |
          git config user.name "lll33lll"
          git config user.email "lll33lll@users.noreply.github.com"
          git add Script/Script.js Script/mihomoScript.js .github/localize.js
          if git diff --cached --quiet; then
            echo "无改动"
          else
            git commit -m "还原去广告默认值：AdBlock 恢复 true（暂不关闭）"
            git push
          fi
