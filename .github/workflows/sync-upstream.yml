name: 同步上游

# 手动触发：仓库页 → Actions → 「同步上游」→ Run workflow
# 做三件事：把上游 AIsouler/MyClash 的改动合过来、把 README 里的链接改回本仓库、跑上游自带的测试。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只看上游有没有更新，不写入不提交
        type: boolean
        default: false
  # 想让它自动跟随上游，取消下面两行的注释（每周一 03:00 北京时间）
  # schedule:
  #   - cron: '0 19 * * 0'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 看上游有没有更新
        id: check
        run: |
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch --quiet upstream main
          echo "本仓库：$(git rev-parse --short HEAD)"
          echo "上游：  $(git rev-parse --short upstream/main)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'behind=false' >> "$GITHUB_OUTPUT"
            echo '已经是最新，上游没有新提交'
          else
            echo 'behind=true' >> "$GITHUB_OUTPUT"
            echo '上游新提交：'
            git log --oneline --no-decorate HEAD..upstream/main | head -40
          fi

      - name: 合并上游（冲突以上游为准）
        if: steps.check.outputs.behind == 'true' && !inputs.dry_run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge -X theirs --no-edit upstream/main

      - name: 把 README 里的链接改回本仓库
        if: ${{ !inputs.dry_run }}
        run: node .github/localize.js

      - name: 跑上游自带的测试
        if: ${{ !inputs.dry_run }}
        run: |
          npm --prefix Test install
          node Test/run-tests.js

      - name: 提交
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet && git diff --quiet HEAD@{upstream} HEAD 2>/dev/null; then
            echo '无变化'
            exit 0
          fi
          git diff --staged --quiet || git commit -m 'chore: 同步上游并本地化链接'
          git push
