name: adblock-off2

on:
  push:
    paths:
      - '.github/workflows/adblock-off2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 关闭脚本里的去广告默认值（Config 的 yaml 不动）
        run: |
          python3 - <<'PYEOF'
          def patch(path, old, new, n=1):
              s = open(path, encoding='utf-8', newline='').read()
              c = s.count(old)
              if c == 0 and s.count(new) == n:
                  print('已应用，跳过', path)
                  return
              assert c == n, '%s: 期望 %d 处，实到 %d 处' % (path, n, c)
              open(path, 'w', encoding='utf-8', newline='').write(s.replace(old, new))
              print('patched', path)

          patch('Script/mihomoScript.js', '  AdBlock: true, // 广告拦截', '  AdBlock: false, // 广告拦截（默认关闭）')
          patch('Script/Script.js', '  AdBlock: true, // 广告拦截', '  AdBlock: false, // 广告拦截（默认关闭）')
          patch(
              '.github/localize.js',
              "  { file: 'Script/Script.js', switches: ['自动选择', '生成地区自动选择组'] },\n"
              "  { file: 'Script/mihomoScript.js', switches: ['自动选择', '负载均衡', '生成地区自动选择组'] },",
              "  { file: 'Script/Script.js', switches: ['自动选择', '生成地区自动选择组', 'AdBlock'] },\n"
              "  { file: 'Script/mihomoScript.js', switches: ['自动选择', '负载均衡', '生成地区自动选择组', 'AdBlock'] },",
          )
          PYEOF

      - name: 自检
        run: |
          node Test/run-tests.js --node
          GITHUB_REPOSITORY="${{ github.repository }}" node .github/localize.js
          git --no-pager diff --stat -- Config

      - name: 提交
        run: |
          git config user.name "lll33lll"
          git config user.email "lll33lll@users.noreply.github.com"
          git add Script/Script.js Script/mihomoScript.js .github/localize.js
          if git diff --cached --quiet; then
            echo "无改动"
          else
            git commit -m "关闭脚本去广告：AdBlock 默认 false（Config 的两份 yaml 保持不动，开关仍可在面板重新打开）"
            git push
          fi
