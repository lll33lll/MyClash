name: fork-patch（一次性补丁，应用后自删）

on:
  push:
    branches: [main]
    paths:
      - '.github/fork-patch.js'
      - '.github/workflows/fork-patch.yml'

permissions:
  contents: write

concurrency:
  group: fork-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fork patch
        run: node .github/fork-patch.js

      - name: Run test suite
        run: |
          npm --prefix Test install --no-audit --no-fund || true
          node Test/run-tests.js

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/fork-patch.js .github/workflows/fork-patch.yml
          git add -A
          git commit -m 'fix: 默认关闭自动测速（自动选择 / 负载均衡 / 地区自动选择组默认关闭；select 组不再携带 url/interval）' -m '由一次性补丁流程应用，并通过上游测试套件（含新增的两条回归测试）。'
          git push
