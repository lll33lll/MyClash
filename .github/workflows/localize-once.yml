name: localize-once

# 一次性：把 README 里的脚本/配置链接改成本仓库的，改完就把自己删掉。
# 以后每次点「同步上游」都会重跑同一份本地化脚本，不需要再手动改。
on:
  push:
    paths:
      - '.github/workflows/localize-once.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 本地化 README 链接
        run: node .github/localize.js

      - name: 提交并移除本流程
        run: |
          rm .github/workflows/localize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo '无变化'
            exit 0
          fi
          git commit -m 'chore: README 里的链接指向本仓库'
          git pull --rebase --autostash origin main || true
          git push
